<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrante USA | Driving Grid Decarbonization</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Leaflet CSS & JS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            primary: '#1e40af', /* Navy Blue */
                            secondary: '#3b82f6', /* Lighter Blue */
                            dark: '#0F172A',
                            light: '#F8FAFC'
                        }
                    },
                    animation: {
                        'marquee': 'marquee 60s linear infinite',
                        'marquee-reverse': 'marquee-reverse 60s linear infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        },
                        'marquee-reverse': {
                            '0%': { transform: 'translateX(-50%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans text-slate-900 bg-white selection:bg-blue-100 selection:text-blue-900">

    <!-- Header Component -->
    <div id="header-component"></div>

    <main>
        <!-- Hero Slider Component -->
        <div id="hero-slider-component"></div>

        <!-- Main Content with Angled Top Edge -->
        <div id="main-content" class="relative z-10 mt-[100vh]">
            <!-- SVG Separator for Angled Edge -->
            <div class="absolute -top-16 left-0 w-full h-16 z-10 pointer-events-none">
                <svg class="w-full h-full" viewBox="0 0 1440 100" preserveAspectRatio="none">
                    <path fill="#ffffff" d="M0,100 L1440,100 L1440,0 Z"></path>
                </svg>
            </div>

            <div class="bg-white shadow-[0_-20px_50px_rgba(0,0,0,0.3)]">
                <!-- About Component -->
                <div id="about-component"></div>

                <!-- Team Component -->
                <div id="team-component"></div>

                <!-- Clients Marquee Component -->
                <div id="clients-marquee-component"></div>

                <!-- Expertise Component -->
                <div id="expertise-component"></div>

                <!-- Projects Component -->
                <div id="projects-component"></div>

                <!-- Portfolio Map Component -->
                <div id="portfolio-map-component"></div>

                <!-- Contact Component -->
                <div id="contact-component"></div>
            </div>
        </div>
    </main>

    <!-- Footer Component -->
    <div id="footer-component"></div>

    <!-- Modals Component -->
    <div id="modals-component"></div>

    <!-- Load JavaScript -->
    <script src="js/main.js"></script>

    <!-- Component Loader Script -->
    <script>
        // Function to load HTML components
        async function loadComponent(componentId, fileName) {
            try {
                const response = await fetch(`components/${fileName}`);
                const html = await response.text();
                document.getElementById(componentId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading ${fileName}:`, error);
            }
        }

        // Load all components when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            // Load components in order
            await Promise.all([
                loadComponent('header-component', 'header.html'),
                loadComponent('hero-slider-component', 'hero-slider.html'),
                loadComponent('about-component', 'about.html'),
                loadComponent('team-component', 'team.html'),
                loadComponent('clients-marquee-component', 'clients-marquee.html'),
                loadComponent('expertise-component', 'expertise.html'),
                loadComponent('projects-component', 'projects.html'),
                loadComponent('portfolio-map-component', 'portfolio-map.html'),
                loadComponent('contact-component', 'contact.html'),
                loadComponent('footer-component', 'footer.html'),
                loadComponent('modals-component', 'modals.html')
            ]);

            // Initialize icons after all components are loaded
            if (window.lucide) {
                lucide.createIcons();
            }

            // Initialize the project map after components are loaded
            if (document.getElementById('project-map') && typeof initializeProjectMap === 'function') {
                initializeProjectMap();
            }
        });
    </script>
</body>
</html>
