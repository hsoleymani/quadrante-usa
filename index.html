<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrante USA | Driving Grid Decarbonization</title>

    <script src="https://cdn.tailwindcss.com"></script>


    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Leaflet CSS & JS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Archivo', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                        serif: ['Archivo', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            primary: '#1A2B4C', /* Deep Navy Blue */
                            secondary: '#3b82f6', /* Bright Blue for links and accents */
                            accent: '#2563eb', /* Bright blue for highlights */
                            dark: '#1A2B4C',
                            light: '#FFFFFF',
                            gray: {
                                50: '#f8fafc',
                                100: '#f1f5f9',
                                200: '#e2e8f0',
                                300: '#cbd5e1',
                                400: '#94a3b8',
                                500: '#64748b',
                                600: '#475569',
                                700: '#334155',
                                800: '#1e293b',
                                900: '#1A2B4C'
                            }
                        }
                    },
                    animation: {
                        'marquee': 'marquee 60s linear infinite',
                        'marquee-reverse': 'marquee-reverse 60s linear infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        },
                        'marquee-reverse': {
                            '0%': { transform: 'translateX(-50%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans text-brand-dark bg-white selection:bg-brand-accent selection:text-white">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 z-[9999] flex items-center justify-center px-4 cursor-pointer" onclick="skipLoadingAnimation()">
        <div class="flex items-center justify-center space-x-4 sm:space-x-8 md:space-x-16 w-full max-w-5xl">
            <!-- Quadrante Logo -->
            <div id="logo-left" class="flex items-center justify-center opacity-0 transform -translate-x-32">
                <img src="assets/images/media/logo-quadrante.png" alt="Quadrante" class="h-[60px] md:h-[90px] w-auto object-contain">
            </div>

            <!-- Plus Sign -->
            <div id="plus-sign" class="text-3xl sm:text-4xl md:text-6xl lg:text-8xl font-bold text-slate-700 opacity-0 transform scale-0">+</div>

            <!-- Right Analytics Logo (better balanced size) -->
            <div id="logo-right" class="flex items-center justify-center opacity-0 transform translate-x-32">
                <img src="assets/images/media/logo-right-analytics.png" alt="Right Analytics" class="h-[130px] md:h-[200px] w-auto object-contain">
            </div>
        </div>


        <!-- Loading Text -->
        <div class="absolute bottom-16 left-1/2 transform -translate-x-1/2">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-slate-600 rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
                <div class="w-2 h-2 bg-slate-600 rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
                <div class="w-2 h-2 bg-slate-600 rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
            </div>
        </div>
    </div>

    <!-- Main Website Content (hidden during loading) -->
    <div id="main-website" class="opacity-0 transition-opacity duration-500">
        <!-- Header Component -->
        <div id="header-component"></div>

        <main>
            <!-- Hero Slider Component -->
            <div id="hero-slider-component"></div>

            <!-- Main Content with Straight Edge -->
            <div id="main-content" class="relative z-10">
                <div class="bg-white">
                    <!-- About Component -->
                    <div id="about-component"></div>

                    <!-- Team Component -->
                    <div id="team-component"></div>

                    <!-- Clients Marquee Component -->
                    <div id="clients-marquee-component"></div>

                    <!-- Expertise Component -->
                    <div id="expertise-component"></div>

                    <!-- Portfolio Map Component -->
                    <div id="portfolio-map-component"></div>

                    <!-- Contact Component -->
                    <div id="contact-component"></div>
                </div>
            </div>
        </main>

        <!-- Footer Component -->
        <div id="footer-component"></div>

        <!-- Modals Component -->
        <div id="modals-component"></div>
    </div>

    <!-- Load JavaScript -->
    <script src="js/main.js"></script>

    <!-- Component Loader Script -->
    <script>
        // Function to load HTML components
        async function loadComponent(componentId, fileName) {
            try {
                const response = await fetch(`components/${fileName}`);
                const html = await response.text();
                document.getElementById(componentId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading ${fileName}:`, error);
            }
        }

        // Initialize loading animation
        function initializeLoadingAnimation() {
            const logoLeft = document.getElementById('logo-left');
            const logoRight = document.getElementById('logo-right');
            const plusSign = document.getElementById('plus-sign');
            const loadingScreen = document.getElementById('loading-screen');

            // Prevent scrolling during loading animation
            document.body.style.overflow = 'hidden';

            // Set CSS custom properties for animation directions (responsive distance)
            const isMobile = window.innerWidth < 640;
            const startDistance = isMobile ? '-128px' : '-256px';
            logoLeft.style.setProperty('--start-position', startDistance);
            logoRight.style.setProperty('--start-position', startDistance.replace('-', ''));

            // Start the animation sequence
            setTimeout(() => {
                logoLeft.classList.add('loading-logo-enter');
                logoRight.classList.add('loading-logo-enter');
            }, 300);

            setTimeout(() => {
                plusSign.classList.add('loading-plus-enter');
            }, 700);

            // Hide loading screen after 3 seconds
            setTimeout(() => {
                loadingScreen.classList.add('loading-screen-exit');

                // Show main website content as loading screen fades out
                setTimeout(() => {
                    const mainWebsite = document.getElementById('main-website');
                    mainWebsite.classList.remove('opacity-0');
                    mainWebsite.classList.add('opacity-100');

                    // Re-enable scrolling
                    document.body.style.overflow = '';
                }, 400);

                // Remove loading screen from DOM after animation completes
                setTimeout(() => {
                    loadingScreen.remove();
                }, 800);
            }, 3000);
        }

        // Skip loading animation function
        function skipLoadingAnimation() {
            const loadingScreen = document.getElementById('loading-screen');
            const mainWebsite = document.getElementById('main-website');

            // Immediately hide loading screen and show main website
            loadingScreen.classList.add('loading-screen-exit');

            // Show main website content immediately
            setTimeout(() => {
                mainWebsite.classList.remove('opacity-0');
                mainWebsite.classList.add('opacity-100');

                // Re-enable scrolling
                document.body.style.overflow = '';

                // Remove loading screen from DOM
                setTimeout(() => {
                    loadingScreen.remove();
                }, 400);
            }, 100);
        }

        // Start loading animation immediately
        initializeLoadingAnimation();

        // Load all components when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            // Load components in order
            await Promise.all([
                loadComponent('header-component', 'header.html'),
                loadComponent('hero-slider-component', 'hero-slider.html'),
                loadComponent('about-component', 'about.html'),
                loadComponent('team-component', 'team.html'),
                loadComponent('clients-marquee-component', 'clients-marquee.html'),
                loadComponent('expertise-component', 'expertise.html'),
                loadComponent('portfolio-map-component', 'portfolio-map.html'),
                loadComponent('contact-component', 'contact.html'),
                loadComponent('footer-component', 'footer.html'),
                loadComponent('modals-component', 'modals.html')
            ]);

            // Initialize icons after all components are loaded
            if (window.lucide) {
                lucide.createIcons();
            }

            // Initialize the hero slider after components are loaded
            if (typeof initializeSlider === 'function') {
                setTimeout(() => {
                    initializeSlider();
                    console.log('Slider initialized successfully');
                }, 100);
            }

            // Initialize mobile menu button after header is loaded
            setTimeout(() => {
                const mobileMenuBtn = document.getElementById('mobile-menu-btn');
                if (mobileMenuBtn && typeof handleMobileMenuClick === 'function') {
                    mobileMenuBtn.addEventListener('click', handleMobileMenuClick);
                    if ('ontouchstart' in window) {
                        mobileMenuBtn.addEventListener('touchstart', handleMobileMenuClick, {passive: false});
                    }
                    mobileMenuBtn.style.pointerEvents = 'auto';
                    console.log('Mobile menu button initialized');
                }
            }, 150);

            // Initialize the project map after components are loaded
            if (document.getElementById('project-map') && typeof initializeProjectMap === 'function') {
                // Wait a bit for DOM to settle
                setTimeout(() => {
                    initializeProjectMap();
                    console.log('Map initialized successfully');
                }, 100);
            } else {
                console.log('Map element or init function not found');
            }

        });
    </script>
</body>
</html>
